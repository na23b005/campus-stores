# Render Blueprint: the GraphQL API (rootDir server).
# The Postgres database already exists: paste its connection URL into DATABASE_URL in the dashboard.
services:
  - type: web
    name: campus-stores-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://YOUR-SITE.netlify.app
