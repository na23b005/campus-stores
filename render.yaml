# Render Blueprint: Postgres + the GraphQL API (rootDir server).
databases:
  - name: campus-stores-db
    plan: free
    databaseName: campus_stores
    user: campus_stores

services:
  - type: web
    name: campus-stores-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-stores-db
          property: connectionString
      - key: PGSSL
        value: "1"
      - key: CORS_ORIGIN
        value: https://YOUR-SITE.netlify.app
